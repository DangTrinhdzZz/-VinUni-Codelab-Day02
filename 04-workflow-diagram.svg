<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2700" viewBox="0 0 1800 2700">
  <defs>
    <style>
      .title { font: 700 50px Arial, 'DejaVu Sans', sans-serif; fill: #102a43; }
      .subtitle { font: 400 25px Arial, 'DejaVu Sans', sans-serif; fill: #486581; }
      .step { font: 700 29px Arial, 'DejaVu Sans', sans-serif; fill: #102a43; }
      .actor { font: 700 22px Arial, 'DejaVu Sans', sans-serif; fill: #ffffff; }
      .label { font: 700 22px Arial, 'DejaVu Sans', sans-serif; fill: #334e68; }
      .body { font: 400 22px Arial, 'DejaVu Sans', sans-serif; fill: #334e68; }
      .time { font: 700 22px Arial, 'DejaVu Sans', sans-serif; fill: #7c2d12; }
      .handoff { font: 700 21px Arial, 'DejaVu Sans', sans-serif; fill: #9b2c2c; }
      .legend { font: 600 20px Arial, 'DejaVu Sans', sans-serif; fill: #334e68; }
      .footer { font: 700 23px Arial, 'DejaVu Sans', sans-serif; fill: #102a43; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#243b53" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L8,4 z" fill="#486581"/>
    </marker>
  </defs>

  <rect width="1800" height="2700" fill="#f7fafc"/>
  <rect x="0" y="0" width="1800" height="235" fill="#e6f6ff"/>
  <text x="900" y="82" text-anchor="middle" class="title">CURRENT-STATE WORKFLOW</text>
  <text x="900" y="132" text-anchor="middle" class="subtitle">Vinhomes — Tiếp nhận và điều hướng phản ánh cư dân</text>
  <text x="900" y="178" text-anchor="middle" class="subtitle">Mô hình giả định để scoping • Chưa được xác nhận bằng khảo sát vận hành</text>

  <rect x="185" y="258" width="27" height="27" rx="5" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/>
  <text x="226" y="280" class="legend">Bottleneck</text>
  <line x1="430" y1="272" x2="490" y2="272" stroke="#c53030" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="510" y="280" class="legend">Handoff giữa actor</text>
  <rect x="818" y="252" width="140" height="40" rx="20" fill="#ffedd5"/>
  <text x="888" y="279" text-anchor="middle" class="time">⏱ Thời gian</text>
  <text x="1000" y="280" class="legend">= giả định thiết kế cần xác minh</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="180" y="350" width="1440" height="230" rx="24" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/>
  </g>
  <rect x="180" y="350" width="18" height="230" rx="9" fill="#2f80ed"/>
  <text x="235" y="405" class="step">1. Cư dân gửi phản ánh</text>
  <rect x="1300" y="374" width="265" height="48" rx="24" fill="#2f80ed"/>
  <text x="1432" y="406" text-anchor="middle" class="actor">ACTOR: CƯ DÂN</text>
  <text x="235" y="458" class="label">Input:</text><text x="335" y="458" class="body">Hiện tượng cần phản ánh, vị trí biết được</text>
  <text x="235" y="504" class="label">Hoạt động:</text><text x="365" y="504" class="body">Nhập nội dung tự do và gửi qua kênh tiếp nhận</text>
  <text x="235" y="550" class="label">Output:</text><text x="345" y="550" class="body">Phản ánh thô</text>
  <rect x="1372" y="505" width="190" height="50" rx="25" fill="#ffedd5"/>
  <text x="1467" y="538" text-anchor="middle" class="time">⏱ 2 phút</text>

  <line x1="900" y1="580" x2="900" y2="650" stroke="#c53030" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow)"/>
  <rect x="975" y="595" width="560" height="42" rx="20" fill="#fff5f5" stroke="#feb2b2"/>
  <text x="1255" y="623" text-anchor="middle" class="handoff">HANDOFF 1: Cư dân → Nhân viên CSKH</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)"><rect x="180" y="660" width="1440" height="230" rx="24" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/></g>
  <rect x="180" y="660" width="18" height="230" rx="9" fill="#5c6ac4"/>
  <text x="235" y="715" class="step">2. Nhân viên CSKH đọc nội dung</text>
  <rect x="1240" y="684" width="325" height="48" rx="24" fill="#5c6ac4"/>
  <text x="1402" y="716" text-anchor="middle" class="actor">ACTOR: NHÂN VIÊN CSKH</text>
  <text x="235" y="768" class="label">Input:</text><text x="335" y="768" class="body">Phản ánh thô</text>
  <text x="235" y="814" class="label">Hoạt động:</text><text x="365" y="814" class="body">Đọc, diễn giải nội dung và ghi nhận yêu cầu chính</text>
  <text x="235" y="860" class="label">Output:</text><text x="345" y="860" class="body">Ghi chú tiếp nhận ban đầu</text>
  <rect x="1372" y="815" width="190" height="50" rx="25" fill="#ffedd5"/>
  <text x="1467" y="848" text-anchor="middle" class="time">⏱ 3 phút</text>

  <line x1="900" y1="890" x2="900" y2="960" stroke="#486581" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)"><rect x="180" y="970" width="1440" height="230" rx="24" fill="#fff4e6" stroke="#e8590c" stroke-width="5"/></g>
  <rect x="180" y="970" width="18" height="230" rx="9" fill="#e8590c"/>
  <text x="235" y="1025" class="step">3. Xác định dự án, tòa nhà và vị trí</text>
  <rect x="1240" y="994" width="325" height="48" rx="24" fill="#5c6ac4"/>
  <text x="1402" y="1026" text-anchor="middle" class="actor">ACTOR: NHÂN VIÊN CSKH</text>
  <text x="235" y="1078" class="label">Input:</text><text x="335" y="1078" class="body">Nội dung + thông tin tài khoản có sẵn</text>
  <text x="235" y="1124" class="label">Hoạt động:</text><text x="365" y="1124" class="body">Tìm dự án, tòa, căn hoặc khu vực được nhắc tới</text>
  <text x="235" y="1170" class="label">Output:</text><text x="345" y="1170" class="body">Thông tin vị trí • BOTTLENECK A: thường thiếu hoặc mơ hồ</text>
  <rect x="1372" y="1125" width="190" height="50" rx="25" fill="#fed7aa"/>
  <text x="1467" y="1158" text-anchor="middle" class="time">⏱ 4 phút</text>

  <line x1="900" y1="1200" x2="900" y2="1270" stroke="#486581" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)"><rect x="180" y="1280" width="1440" height="230" rx="24" fill="#fff4e6" stroke="#e8590c" stroke-width="5"/></g>
  <rect x="180" y="1280" width="18" height="230" rx="9" fill="#e8590c"/>
  <text x="235" y="1335" class="step">4. Phân loại loại vấn đề</text>
  <rect x="1240" y="1304" width="325" height="48" rx="24" fill="#5c6ac4"/>
  <text x="1402" y="1336" text-anchor="middle" class="actor">ACTOR: NHÂN VIÊN CSKH</text>
  <text x="235" y="1388" class="label">Input:</text><text x="335" y="1388" class="body">Nội dung + vị trí</text>
  <text x="235" y="1434" class="label">Hoạt động:</text><text x="365" y="1434" class="body">Diễn giải ngôn ngữ tự do và chọn nhóm vấn đề</text>
  <text x="235" y="1480" class="label">Output:</text><text x="345" y="1480" class="body">Category thủ công • BOTTLENECK B: từ đồng nghĩa, nhiều vấn đề</text>
  <rect x="1372" y="1435" width="190" height="50" rx="25" fill="#fed7aa"/>
  <text x="1467" y="1468" text-anchor="middle" class="time">⏱ 4 phút</text>

  <line x1="900" y1="1510" x2="900" y2="1580" stroke="#486581" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g filter="url(#shadow)"><rect x="180" y="1590" width="1440" height="230" rx="24" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/></g>
  <rect x="180" y="1590" width="18" height="230" rx="9" fill="#5c6ac4"/>
  <text x="235" y="1645" class="step">5. Đánh giá mức độ ưu tiên</text>
  <rect x="1240" y="1614" width="325" height="48" rx="24" fill="#5c6ac4"/>
  <text x="1402" y="1646" text-anchor="middle" class="actor">ACTOR: NHÂN VIÊN CSKH</text>
  <text x="235" y="1698" class="label">Input:</text><text x="335" y="1698" class="body">Hiện tượng + phạm vi ảnh hưởng</text>
  <text x="235" y="1744" class="label">Hoạt động:</text><text x="365" y="1744" class="body">Đánh giá low / medium / high / urgent</text>
  <text x="235" y="1790" class="label">Output:</text><text x="345" y="1790" class="body">Priority thủ công</text>
  <rect x="1372" y="1745" width="190" height="50" rx="25" fill="#ffedd5"/>
  <text x="1467" y="1778" text-anchor="middle" class="time">⏱ 3 phút</text>

  <line x1="900" y1="1820" x2="900" y2="1890" stroke="#486581" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <g filter="url(#shadow)"><rect x="180" y="1900" width="1440" height="230" rx="24" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/></g>
  <rect x="180" y="1900" width="18" height="230" rx="9" fill="#5c6ac4"/>
  <text x="235" y="1955" class="step">6. Chuyển đến bộ phận xử lý</text>
  <rect x="1240" y="1924" width="325" height="48" rx="24" fill="#5c6ac4"/>
  <text x="1402" y="1956" text-anchor="middle" class="actor">ACTOR: NHÂN VIÊN CSKH</text>
  <text x="235" y="2008" class="label">Input:</text><text x="335" y="2008" class="body">Category + priority + ghi chú</text>
  <text x="235" y="2054" class="label">Hoạt động:</text><text x="365" y="2054" class="body">Chọn bộ phận và thực hiện chuyển giao</text>
  <text x="235" y="2100" class="label">Output:</text><text x="345" y="2100" class="body">Ticket được handoff</text>
  <rect x="1372" y="2055" width="190" height="50" rx="25" fill="#ffedd5"/>
  <text x="1467" y="2088" text-anchor="middle" class="time">⏱ 2 phút</text>

  <line x1="900" y1="2130" x2="900" y2="2200" stroke="#c53030" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow)"/>
  <rect x="975" y="2145" width="590" height="42" rx="20" fill="#fff5f5" stroke="#feb2b2"/>
  <text x="1270" y="2173" text-anchor="middle" class="handoff">HANDOFF 2: CSKH → Bộ phận chuyên môn</text>

  <!-- Step 7 -->
  <g filter="url(#shadow)"><rect x="180" y="2210" width="1440" height="230" rx="24" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/></g>
  <rect x="180" y="2210" width="18" height="230" rx="9" fill="#00875a"/>
  <text x="235" y="2265" class="step">7. Tiếp nhận và cập nhật trạng thái</text>
  <rect x="1160" y="2234" width="405" height="48" rx="24" fill="#00875a"/>
  <text x="1362" y="2266" text-anchor="middle" class="actor">ACTOR: BỘ PHẬN CHUYÊN MÔN</text>
  <text x="235" y="2318" class="label">Input:</text><text x="335" y="2318" class="body">Ticket đã chuyển</text>
  <text x="235" y="2364" class="label">Hoạt động:</text><text x="365" y="2364" class="body">Kiểm tra sơ bộ, tiếp nhận và cập nhật trạng thái</text>
  <text x="235" y="2410" class="label">Output:</text><text x="345" y="2410" class="body">Trạng thái tiếp nhận ban đầu</text>
  <rect x="1372" y="2365" width="190" height="50" rx="25" fill="#ffedd5"/>
  <text x="1467" y="2398" text-anchor="middle" class="time">⏱ 4 phút</text>

  <rect x="180" y="2495" width="1440" height="145" rx="25" fill="#e6f6ff" stroke="#2f80ed" stroke-width="3"/>
  <text x="900" y="2550" text-anchor="middle" class="footer">TỔNG THỜI GIAN XỬ LÝ BAN ĐẦU GIẢ ĐỊNH: 22 PHÚT / LƯỢT</text>
  <text x="900" y="2595" text-anchor="middle" class="subtitle">Không gồm thời gian khảo sát hiện trường hoặc khắc phục sự cố</text>
  <text x="900" y="2628" text-anchor="middle" class="subtitle">Toàn bộ thời gian là giả định thiết kế cần xác minh bằng log thực tế</text>
</svg>
